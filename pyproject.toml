[project]
name = "matchagent"
version = "0.1.0"
description = "LLM agent for football match analysis on StatsBomb Open Data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
